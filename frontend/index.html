<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="软件工程（FZU–MU）极限编程作业 · 通讯录前端">
  <title>通讯录 · Address Book</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="通讯录首页">
      <span class="brand-mark">AB</span>
      <span class="brand-text">
        <strong>通讯录</strong>
        <small>Address Book</small>
      </span>
    </a>

    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="搜索姓名、分组、备注或联系方式" autocomplete="off" aria-label="搜索联系人">
      <kbd>Ctrl K</kbd>
    </div>

    <div class="topbar-actions">
      <span class="conn" id="conn-badge" data-state="checking">检测后端…</span>
      <button class="btn ghost" id="btn-template" type="button" title="下载导入模板">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span class="btn-label">模板</span>
      </button>
      <button class="btn ghost" id="btn-import" type="button" title="从 Excel 导入">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>
        <span class="btn-label">导入</span>
      </button>
      <button class="btn ghost" id="btn-export" type="button" title="导出为 Excel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
        <span class="btn-label">导出</span>
      </button>
      <button class="btn primary" id="btn-new" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">新建联系人</span>
      </button>
      <input id="file-input" type="file" accept=".xlsx,.xls" hidden>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <p class="sidebar-title">视图</p>
      <nav id="filter-nav" class="filter-nav" aria-label="按视图筛选"></nav>
      <p class="sidebar-title" id="group-title">分组</p>
      <nav id="group-nav" class="filter-nav" aria-label="按分组筛选"></nav>
      <div class="sidebar-foot">
        <span><b id="stat-total">0</b> 位联系人</span>
        <span><b id="stat-fav">0</b> 位收藏</span>
      </div>
    </aside>

    <section class="list-pane" aria-label="联系人列表">
      <header class="pane-head">
        <h2 id="list-title">全部联系人</h2>
        <span class="pill" id="list-count">0</span>
      </header>

      <ul class="contact-list" id="contact-list"></ul>

      <div class="empty" id="list-empty" hidden>
        <div class="empty-art">📇</div>
        <p id="empty-text">还没有联系人</p>
        <button class="btn primary" id="btn-empty-new" type="button">新建第一位联系人</button>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane" aria-label="联系人详情">
      <div class="detail-empty" id="detail-empty">
        <div class="empty-art">👈</div>
        <p>从左侧选择一位联系人查看详情</p>
      </div>
      <article class="detail" id="detail" hidden></article>
    </section>
  </main>
</div>

<!-- 新建 / 编辑 -->
<div class="modal-backdrop" id="editor-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <header class="modal-head">
      <h3 id="editor-title">新建联系人</h3>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </header>
    <form id="editor-form" class="modal-body" novalidate>
      <div class="grid-2">
        <label class="field">
          <span>姓名 <em>*</em></span>
          <input name="name" maxlength="100" placeholder="张三" autocomplete="off">
        </label>
        <label class="field">
          <span>分组</span>
          <input name="group" maxlength="100" placeholder="同事 / 家人 / 客户" list="group-options" autocomplete="off">
          <datalist id="group-options"></datalist>
        </label>
      </div>

      <label class="field">
        <span>备注</span>
        <textarea name="note" rows="2" maxlength="1000" placeholder="选填，例如：周三前回访"></textarea>
      </label>

      <div class="methods">
        <div class="methods-head">
          <span>联系方式 <em>*</em></span>
          <button class="btn tiny" id="btn-add-method" type="button">＋ 添加一项</button>
        </div>
        <div class="method-rows" id="method-rows"></div>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <footer class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" id="btn-save" type="submit">保存</button>
      </footer>
    </form>
  </div>
</div>

<!-- 确认 -->
<div class="modal-backdrop" id="confirm-modal" hidden>
  <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <header class="modal-head">
      <h3 id="confirm-title">确认操作</h3>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </header>
    <div class="modal-body">
      <p id="confirm-text" class="confirm-text"></p>
    </div>
    <footer class="modal-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn danger" id="confirm-ok" type="button">确定</button>
    </footer>
  </div>
</div>

<!-- 导入结果 -->
<div class="modal-backdrop" id="result-modal" hidden>
  <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <header class="modal-head">
      <h3 id="result-title">导入结果</h3>
      <button class="icon-btn" type="button" data-close aria-label="关闭">✕</button>
    </header>
    <div class="modal-body">
      <div class="result-stats">
        <div class="stat"><b id="res-inserted">0</b><span>新增</span></div>
        <div class="stat"><b id="res-updated">0</b><span>合并</span></div>
        <div class="stat"><b id="res-failed">0</b><span>跳过</span></div>
      </div>
      <ul class="result-errors" id="res-errors"></ul>
    </div>
    <footer class="modal-foot">
      <button class="btn primary" type="button" data-close>知道了</button>
    </footer>
  </div>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
